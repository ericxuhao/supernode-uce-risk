[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "uce-risk"
version = "1.4.0"
description = "按字段自适应的计算卡不可纠正错误 1/4/24 小时风险预测（AI + 规则混合）"
readme = "docs/ALGORITHM.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "lightgbm>=4.0", "pyarrow>=12", "joblib>=1.2"]

[project.optional-dependencies]
tune = ["optuna>=3.4"]
server = ["flask>=2.3", "optuna>=3.4"]
bd = ["openpyxl>=3.1"]          # 读取 .xlsx 工单（BD 适配）；工单为 CSV / Parquet 时不需要

[project.scripts]
uce-risk = "uce_risk.cli:main"

[tool.setuptools]
packages = ["uce_risk"]
